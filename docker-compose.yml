# Local dev infra for adVance.AI — Postgres + Redis + MinIO (S3-compatible object storage).
# Requires Docker Desktop. Run: docker compose up -d
# Swap MinIO for Cloudflare R2 / AWS S3 in production by changing backend .env only —
# the app talks to storage via the S3 API (boto3), so no code changes needed.

services:
  postgres:
    image: postgres:16-alpine
    container_name: advance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: advance
      POSTGRES_PASSWORD: advance_dev_password
      POSTGRES_DB: advance_ai
    ports:
      - "5432:5432"
    volumes:
      - .docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advance -d advance_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: advance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - .docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: advance-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: advance_minio
      MINIO_ROOT_PASSWORD: advance_minio_dev_password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - .docker-data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the media-assets bucket on first startup, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: advance-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # Bucket stays private (no anonymous access) — files are served via signed URLs
    # generated by the backend (SDD §3.6: "jangan public bucket langsung").
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 advance_minio advance_minio_dev_password &&
      mc mb --ignore-existing local/media-assets
      "
